[workspace]
resolver = "2"
members = [
  "crates/marketcow-api",
  "crates/marketcow-contracts",
  "crates/marketcow-core",
  "crates/marketcow-jobs",
  "crates/marketcow-polymarket",
  "crates/marketcow-runtime",
  "crates/marketcow-storage",
  "crates/marketcowd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "1.7"
axum = { version = "0.8", features = ["ws"] }
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clickhouse = { version = "0.15.1", features = ["chrono"] }
clap = { version = "4.5", features = ["derive"] }
crc32c = "0.6"
hex = "0.4"
futures-util = "0.3"
http = "1.3"
libc = "0.2"
rust_decimal = { version = "1.37", features = ["serde-with-str"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
url = "2.5"
