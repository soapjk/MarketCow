name: SDK boundary compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sdk/**'
      - 'crates/marketcow-contracts/**'
      - 'crates/marketcowd/**'
      - 'scripts/deploy_u1_marketcow.py'
      - 'scripts/export_sdk_repository.py'
      - 'tests/test_sdk_repository_split.py'
      - 'Cargo.*'
permissions:
  contents: read
jobs:
  service-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: cargo test --locked -p marketcow-contracts --test public_wire_identity
      - run: python -m unittest discover -s tests -p test_sdk_repository_split.py
      - run: python scripts/export_sdk_repository.py --output "$RUNNER_TEMP/standalone-sdk"
      - run: cargo test --locked --manifest-path "$RUNNER_TEMP/standalone-sdk/Cargo.toml" -p marketcow-wire -p marketcow-sdk
      - name: Existing service adapters
        run: cargo test --locked -p marketcowd --bin marketcow-discovery-collector -- btc_typed_history::native_tests sdk_access::tests
