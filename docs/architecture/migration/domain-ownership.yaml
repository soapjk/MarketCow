schema_version: marketcow.domain-ownership.v2
revision: polymarket-final-architecture
service_boundary:
  kind: market_data_read_service
  trading_interfaces_allowed: false
  order_signing_credentials_allowed: false
domains:
  public_gateway:
    current_owner: python
    polymarket_live_upstream: rust
    writer: none
  polymarket_discovery:
    current_owner: python
    public_access: via_unified_gateway
  polymarket_scope_selection:
    current_owner: tradude
    marketcow_ranking_allowed: false
  polymarket_realtime:
    current_owner: rust
    python_fallback_allowed: false
    writer_gate: single_writer_required
    rust_write_enabled: true
  authoritative_wal:
    current_owner: rust
    append_only: true
  postgresql:
    current_owner: python
    shadow_owner: rust
    rust_write_enabled: false
  clickhouse:
    current_owner: python
    shadow_owner: rust
    rust_write_enabled: false
  python_provider_worker:
    current_owner: python
    transport: uds_only
    public_listener_allowed: false
    database_credentials_allowed: false
lifecycle:
  marketcow_owner: marketcow
  tradude_may_select_scope: true
  tradude_may_manage_marketcow: false
  tradude_may_start_or_stop_marketcow: false
