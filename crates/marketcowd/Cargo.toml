[package]
name = "marketcowd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "marketcow"
path = "src/main.rs"

[[bin]]
name = "marketcow-source-maintenance"
path = "src/source_maintenance.rs"

[[bin]]
name = "marketcow-discovery-collector"
path = "src/discovery_collector.rs"

[[bin]]
name = "marketcow-live-source-bridge"
path = "src/live_source_bridge.rs"

[[bin]]
name = "marketcow-btc-db-migrate"
path = "src/btc_observation_migrate.rs"

[dependencies]
anyhow.workspace = true
rusqlite.workspace = true
arc-swap.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
http.workspace = true
hex.workspace = true
prost.workspace = true
libc.workspace = true
marketcow-core = { path = "../marketcow-core" }
marketcow-jobs = { path = "../marketcow-jobs" }
marketcow-polymarket = { path = "../marketcow-polymarket" }
marketcow-contracts = { path = "../marketcow-contracts" }
marketcow-api = { path = "../marketcow-api" }
marketcow-runtime = { path = "../marketcow-runtime" }
marketcow-realtime = { path = "../marketcow-realtime" }
marketcow-storage = { path = "../marketcow-storage" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
rust_decimal.workspace = true
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
rustls.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
tempfile.workspace = true
uuid.workspace = true
url.workspace = true

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true
