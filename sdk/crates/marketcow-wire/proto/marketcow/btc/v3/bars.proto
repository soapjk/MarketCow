syntax = "proto3";
package marketcow.btc.v3;
// Existing finalized K-line owners only; no arbitrary historical download.
message FinalizedBar {
  int64 open_time_ms = 1;
  int64 close_time_ms = 2;
  string open = 3;
  string high = 4;
  string low = 5;
  string close = 6;
  string base_volume = 7;
  string quote_volume = 8;
  uint64 trade_count = 9;
  string taker_buy_base_volume = 10;
  string taker_buy_quote_volume = 11;
  optional int64 source_event_time_ms = 12;
  optional string available_at = 13; // Local observation fact, not supplier time.
  optional string provenance_kind = 14;
}
message FinalizedWindow {
  string schema_version = 1; // marketcow.binance-finalized-window.v3
  string instrument_id = 2;
  uint32 interval_ms = 3; // 1000 or 60000
  string stream_id = 4;
  bool ready = 5;
  optional string reason = 6;
  uint64 checkpoint_sequence = 7;
  uint64 durable_sequence = 8;
  int64 expected_last_open_ms = 9;
  repeated FinalizedBar bars = 10;
  optional int64 after_open_ms = 11;
  optional int64 retained_first_open_ms = 12;
  uint32 window_bar_count = 13;
  bool gap = 14;
}
