syntax = "proto3";
package marketcow.common.v1;
// Private administrator configuration, never returned to SDK clients. Tokens
// are opaque secrets; this is not a signing or content-checksum protocol.
message SdkAccessPolicy {
  string schema_version = 1; // marketcow.sdk-access-policy.v1
  uint64 revision = 2;
  repeated SdkCustomer customers = 3;
}
message SdkCustomer {
  string customer_id = 1;
  string bearer_token = 2;
  int64 expires_at_unix_seconds = 3;
  bool prices = 4;
  bool markets = 5;
  bool history = 6;
  bool evidence = 7;
  bool public_rest = 8;
  uint32 maximum_http_requests = 9;
  uint32 maximum_streams = 10;
  uint64 maximum_response_bytes_per_window = 11;
  uint32 quota_window_seconds = 12;
  uint32 maximum_requests_per_window = 13;
}
message SdkServerUsage {
  string schema_version = 1; // marketcow.sdk-usage.v1
  string customer_id = 2;
  uint64 policy_revision = 3;
  int64 window_started_at_unix_seconds = 4;
  uint64 response_payload_bytes = 5;
  uint64 requests = 6;
  uint64 maximum_response_payload_bytes = 7;
  uint32 quota_window_seconds = 8;
}
