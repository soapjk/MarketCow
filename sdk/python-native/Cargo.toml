[package]
name = "marketcow-python"
version = "0.1.2"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
marketcow-sdk = { path = "../crates/marketcow-sdk", version = "0.1.2" }
prost.workspace = true
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py311", "multiple-pymethods"] }
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"] }
tokio.workspace = true

[build-dependencies]
marketcow-wire = { path = "../crates/marketcow-wire", version = "0.1.0" }
prost.workspace = true
prost-types = "0.14"
