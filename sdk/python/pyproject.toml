[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "marketcow-client"
version = "0.1.2"
description = "Typed Python client for the MarketCow public market-data API"
readme = { text = "MarketCow Python SDK: shared Rust core for typed BTC prices, Polymarket order books, indexed history, public reference/finality, finalized bars and explicit public REST. Import Client or AsyncClient from marketcow_sdk; initialize with an endpoint and optional api_key. No trading, signing or account operations are provided.", content-type = "text/plain" }
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.25,<1",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.12,<1",
]

[tool.maturin]
manifest-path = "../python-native/Cargo.toml"
python-source = "src"
module-name = "marketcow_sdk._native"
include = ["src/marketcow_sdk/py.typed", "src/marketcow_sdk/_native.pyi", "src/marketcow_sdk/native.pyi", "src/marketcow_sdk/_facts.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
