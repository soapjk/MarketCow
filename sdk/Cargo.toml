[workspace]
resolver = "2"
members = ["crates/marketcow-wire", "crates/marketcow-sdk", "python-native"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
bytes = "1.10"
futures-util = "0.3"
http = "1.3"
prost = "0.14"
rust_decimal = { version = "1.37", features = ["serde-with-str"] }
thiserror = "2.0"
tempfile = "3.20"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
axum = { version = "0.8", features = ["ws"] }

# Retain the extension's existing Mach-O compatibility setting.
[profile.release.package.marketcow-python]
strip = "none"
