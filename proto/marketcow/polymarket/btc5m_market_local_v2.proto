syntax = "proto3";

package marketcow.polymarket.btc5m.v2;

// MarketCow -> Tradude BTC five-minute market-local contract, version 2.
// Hot snapshots and streams do not expose persistence progress as a trading
// gate. Only separate replay APIs report durable archive bounds.
// This is the only high-frequency feed. A consumer MUST reject another schema
// version; there is no implicit JSON/global-cursor compatibility mode.
// All uint64 cursors are positive after the first event; zero means the empty
// prefix only where explicitly allowed. Every optional scalar uses proto3
// presence: absent is different from zero or the empty string.

message MarketIdentity {
  string market_id = 1;                 // Nonempty decimal Polymarket ID.
  string condition_id = 2;              // 0x-prefixed, 32-byte lowercase hex.
  string profile_id = 3;                // SHA-256 hex of the fixed profile.
  uint64 profile_revision = 4;
  string profile_epoch = 5;             // 32 lowercase hex; changes on publish.
  optional string stream_epoch = 6;     // Absent only before publication.
}

message OutcomeBinding {
  string outcome = 1;                   // Exactly Up or Down.
  string token_id = 2;                  // Nonempty decimal Polymarket ID.
}

message MarketBinding {
  MarketIdentity identity = 1;
  string role = 2;                      // current, next or retiring.
  string window_id = 3;
  string start_at = 4;                  // RFC3339 UTC with microseconds.
  string end_at = 5;
  repeated OutcomeBinding outcomes = 6; // Exactly Up, Down in this order.
  bytes rule_sha256 = 7;               // Exactly 32 bytes.
  uint64 maximum_quote_age_ms = 8;
}

message MarketWatermark {
  MarketIdentity identity = 1;
  optional uint64 published_market_cursor = 2; // Zero is explicit empty prefix.
  optional uint64 replay_floor_market_cursor = 3;
  optional uint64 last_market_event_cursor = 4; // Event prefix, NOT resume.
  optional uint64 confirmation_sequence = 5;   // Memory-only, independent.
}

message PriceLevel {
  string price = 1;                     // Canonical decimal, no float.
  string size = 2;
}

message CanonicalBook {
  string token_id = 1;
  string condition_id = 2;
  string book_epoch = 3;
  uint64 sequence = 4;
  string sequence_semantics = 5;
  optional string exchange_at = 6;    // RFC3339 UTC, source supplied.
  string received_at = 7;              // Canonical observation clock.
  bytes tick_version = 8;               // SHA-256 of the tick-size fact.
  string tick_size = 9;
  repeated PriceLevel bids = 10;       // Strict descending price; no duplicate.
  repeated PriceLevel asks = 11;       // Strict ascending price; no duplicate.
  optional string last_trade_price = 12;
  bytes state_checksum = 13;           // Exactly 32 bytes.
  optional string source_hash = 14;    // Venue hash, not a raw SHA alias.
}

message DepthChange {
  string token_id = 1;
  string side = 2;                      // BUY or SELL.
  string price = 3;
  string size = 4;                      // Zero deletes the level.
}

message BookPostState {
  string token_id = 1;
  string condition_id = 2;
  string book_epoch = 3;
  uint64 sequence = 4;
  string sequence_semantics = 5;
  optional string exchange_at = 6;
  string received_at = 7;
  bytes tick_version = 8;
  string tick_size = 9;
  optional string last_trade_price = 10;
  bytes state_checksum = 11;
  optional string source_hash = 12;
  bytes canonical_book_sha256 = 13;    // Full materialized post-book commitment.
  uint64 materialized_book_bytes = 14; // Canonical JSON book byte length.
}

message BookDelta {
  repeated DepthChange changes = 1;    // Apply in encoded order, atomically.
  BookPostState post_state = 2;
}

message LastTrade {
  string price = 1;
  BookPostState post_state = 2;         // Depth unchanged; book clock advances.
  optional string trade_exchange_at = 3;
  string trade_received_at = 4;
}

message RecoveryStarted {
  string recovery_id = 1;
  string recovery_scope = 2;           // token or market.
  repeated string affected_token_ids = 3;
  string reason = 4;
}

message RecoveryCompleted {
  string recovery_id = 1;
  string recovery_scope = 2;
  // MARKET EVENT cursor of the authoritative snapshot. Never a group or
  // physical archive cursor; it must have been applied in this stream epoch.
  uint64 snapshot_cursor = 3;
  repeated string resolved_gap_token_ids = 4;
}

message RecoveryState {
  string token_id = 1;
  string recovery_id = 2;
  string gap_code = 3;
  string gap_detected_at = 4;
  optional uint64 snapshot_cursor = 5; // Market event cursor, if observed.
}

message SourceGap {
  string token_id = 1;
  string code = 2;
  string reason = 3;
}

message Terminal {
  string reason = 1;
  repeated string retired_token_ids = 2;
  string lifecycle_state = 3;
  optional string winning_outcome = 4;
  string terminal_at = 5;
  bytes lifecycle_evidence_sha256 = 6;
  bytes metadata_revision_sha256 = 7;
}

message MarketEvent {
  // Contiguous within one stream_epoch. A group may contain multiple events;
  // this is not an after_cursor for group replay.
  uint64 market_event_cursor = 1;
  bytes event_id = 2;                   // Producer's 32-byte semantic commitment.
  bytes raw_payload_sha256 = 3;        // Source preimage commitment. A conflated
                                       // price_change embeds every exact supplier
                                       // frame under marketcow_conflation.source_frames.
  bytes canonical_payload_sha256 = 4;  // MarketCow canonical event commitment.
  string market_id = 5;
  string condition_id = 6;
  optional string token_id = 7;
  optional string book_epoch = 8;
  optional uint64 book_sequence = 9;
  optional string exchange_at = 10;
  string received_at = 11;
  optional bool applied = 12;
  optional string fail_closed_reason = 13;
  optional uint64 physical_archive_cursor = 14; // Absent on live WS; present only in durable replay.
  // REQUIRED nonempty canonical JSON of the complete versioned MarketCow
  // source event with only its top-level event_id member removed. This includes
  // raw_payload and canonical_payload. The consumer MUST verify canonical
  // encoding, event_id=SHA256(these bytes), both payload hashes from the
  // corresponding parsed members, and agreement with the typed fields before
  // applying. This is an audit preimage inside the sole protobuf feed, not a
  // parallel JSON feed. physical_archive_cursor is excluded: assigned later.
  bytes source_event_preimage_json = 15;
  oneof payload {
    CanonicalBook book_snapshot = 20;
    BookDelta book_delta = 21;
    LastTrade last_trade = 22;
    RecoveryStarted recovery_started = 23;
    RecoveryCompleted recovery_completed = 24;
    SourceGap source_gap = 25;
    Terminal terminal = 26;
  }
}

message BookConfirmation {
  string token_id = 1;
  string condition_id = 2;
  uint64 confirmation_sequence = 3;
  uint64 book_market_cursor = 4;       // Group containing current book mutation.
  string book_epoch = 5;
  uint64 book_sequence = 6;
  bytes state_checksum = 7;
  string book_received_at = 8;
  string confirmed_at = 9;
  string confirmation_source = 10;
  bytes confirmation_evidence_sha256 = 11;
}

message BookBaseline {
  reserved 9;
  string outcome = 1;
  string token_id = 2;
  optional bool replay_baseline_valid = 3;
  optional uint64 book_market_cursor = 4;
  optional uint64 book_market_event_cursor = 5;
  optional bytes canonical_book_sha256 = 6;
  optional CanonicalBook canonical_book = 7;
  optional RecoveryState active_recovery = 8;
  optional BookConfirmation confirmation = 10;
}

message MarketFullSync {
  MarketBinding binding = 1;
  MarketWatermark watermark = 2;
  repeated BookBaseline books = 3;     // Exactly the binding's two tokens.
  optional string market_unavailable_reason = 4;
  bool snapshot_is_not_execution_readiness = 5; // MUST be true.
}

message MarketStreams {
  string profile_id = 1;
  uint64 profile_revision = 2;
  string profile_epoch = 3;
  repeated MarketBinding markets = 4;
  repeated MarketWatermark watermarks = 5; // Only published markets; join by market_id.
}

message MarketStreamRequest {
  // Logical request model. The existing HTTP WebSocket upgrade carries these
  // same fields as explicit URL query parameters. The cursor parameter is
  // exactly after_market_cursor; after_cursor is not an accepted alias.
  // Stream response is Binary MarketStreamFrame under subprotocol
  // marketcow.btc5m.market-local.v2.
  MarketIdentity identity = 1;
  optional uint64 after_market_cursor = 2; // Explicit zero is valid.
  optional uint64 after_confirmation_sequence = 3; // Independent prefix.
}

message MarketReplayGroup {
  uint64 market_cursor = 1;
  bytes group_sha256 = 2;
  repeated MarketEvent events = 3;
}

message MarketReplayPage {
  string market_id = 1;
  string stream_epoch = 2;
  optional MarketIdentity active_identity = 3; // Absent on cold archive read.
  optional uint64 after_market_cursor = 4; // Exclusive; zero valid.
  optional uint64 next_market_cursor = 5;  // Last complete returned group.
  optional uint64 replay_floor_market_cursor = 6;
  optional uint64 durable_market_cursor = 7;
  optional uint64 published_market_cursor = 8; // Only on hot read.
  bool caught_up = 9; // Only to this archive's durable prefix, never live.
  bool archive_only = 10;
  repeated MarketReplayGroup groups = 11;
}

// Both hot market-replay and cold market-archive-replay HTTP queries use
// market_id, stream_epoch, after_market_cursor, maximum_groups. Their
// Replay durable watermarks are market-group cursors; physical archive
// positions remain separate optional evidence on each durable event.

message MarketGroupBegin {
  uint64 market_cursor = 1;
  bytes group_sha256 = 2;
  uint32 event_count = 3;
  uint32 chunk_count = 4;
}

message MarketGroupChunk {
  uint64 market_cursor = 1;
  bytes group_sha256 = 2;
  uint32 chunk_index = 3;              // Zero based, strictly contiguous.
  uint32 chunk_count = 4;
  repeated MarketEvent events = 5;
}

message MarketGroupCommit {
  uint64 market_cursor = 1;
  bytes group_sha256 = 2;
  uint32 event_count = 3;
  uint32 chunk_count = 4;
  uint64 next_after_market_cursor = 5; // Equal to market_cursor.
}

message MarketReady {
  // The producer freezes one complete-group prefix at stream admission.
  // Ready follows delivery of that prefix; it need not wait for a liquid
  // market to stop publishing. Newer groups follow ready in FIFO order.
  optional uint64 market_cursor = 1;   // Zero valid if no group yet.
  optional uint64 last_market_event_cursor = 2;
  optional uint64 confirmation_sequence = 3;
  // Complete current-book confirmation fact set at this sequence. Empty is
  // meaningful and MUST clear superseded facts atomically before ready=true.
  repeated BookConfirmation confirmations = 4;
  optional bool execution_readiness = 5; // MUST be present and false.
}

message BookConfirmations {
  optional uint64 sent_market_cursor = 1; // Zero valid.
  uint64 confirmation_sequence = 2;   // Strictly increases after ready.
  // May be empty when every new fact was superseded by a later book before
  // delivery. Empty advances only the confirmation prefix; it never refreshes
  // a book or creates execution evidence.
  repeated BookConfirmation confirmations = 3;
  // Memory-only freshness. Never mutates canonical book, group cursor or
  // archive state; older book identities are ignored, not rebound.
}

message MarketUnavailable {
  optional uint64 after_market_cursor = 1; // Zero valid.
  string reason = 2;
  bool requires_new_market_full_sync = 3; // MUST be true.
}

message ProfileChanged {
  optional uint64 after_market_cursor = 1; // Zero valid.
  string next_profile_id = 2;
  uint64 next_profile_revision = 3;
  string next_profile_epoch = 4;
  bool requires_new_market_full_sync = 5; // MUST be true.
}

message MarketStreamFrame {
  MarketIdentity identity = 1;
  oneof body {
    MarketGroupBegin group_begin = 10;
    MarketGroupChunk group_chunk = 11;
    MarketGroupCommit group_commit = 12;
    MarketReady ready = 13;
    BookConfirmations book_confirmations = 14;
    MarketUnavailable unavailable = 16;
    ProfileChanged profile_changed = 17;
  }
}

message ArchiveEventLocation {
  MarketIdentity identity = 1;
  uint64 market_cursor = 2;
  uint64 market_event_cursor = 3;
  uint64 physical_archive_cursor = 4; // Only in durable archive evidence.
  bytes event_id = 5;
}

// Hash contract (not protobuf wire bytes): existing MarketCow canonical JSON
// uses recursively lexicographically sorted UTF-8 keys, compact separators,
// unescaped UTF-8, integer cursors in base 10, no floats, then SHA-256.
// raw_payload_sha256 is SHA256(canonical_json(raw_payload)). For an ordinary
// event raw_payload is one supplier JSON frame; for a depth-conflated event it
// is a MarketCow aggregate containing all supplier frames and receipt clocks.
// A consumer seeing marketcow_conflation MUST verify its version, 2..64 exact
// source frames, source_frame_count, first/last receipt clocks, common market
// and token, unchanged BBO, and final last-write-wins depth assignments. It
// must not interpret the synthetic outer raw payload as a supplier WS frame.
// canonical_payload_sha256 is SHA256(canonical_json(the event's canonical
// MarketCow payload)); event_id is SHA256(canonical_json(the versioned source
// envelope with its event_id member removed)). These hashes commit producer
// facts. source_event_preimage_json makes all three producer commitments
// independently recomputable. The full canonical book hash and checksum are
// independently checked against the typed materialized book. group_sha256
// preimage is exactly:
// {"event_ids":[lowercase-hex event_id in event order],
//  "market_cursor":uint64,"market_id":string,
//  "schema_version":"marketcow.polymarket.market-group.v2",
//  "stream_epoch":string}
// with keys serialized in the shown sorted order and no whitespace. Event ID,
// raw and canonical payload commitments retain their separately versioned
// MarketCow semantic preimages; consumers MUST NOT hash protobuf bytes or use
// physical_archive_cursor as a market-event or group cursor. A semantic hash
// algorithm change requires its own schema revision and fixed producer vector.
//
// A stream_epoch is born with group/event cursors zero, and is invalidated by
// market retirement/re-admission, rebuild or restart. A new profile_epoch
// invalidates all prior role bindings. No cursor, confirmation sequence or
// in-flight group may cross either epoch. On partial-group disconnect, discard
// the group and resume from the last *applied* complete market_cursor. Ready
// requires both group and confirmation prefixes; no control frame can appear
// between begin and commit. Physical archive cursor is assigned asynchronously
// after publication and never gates live delivery.
